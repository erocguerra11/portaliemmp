<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portal IEMMP</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body class="pagina-login">

        <div class="login-container">
            <img src="logo.jpg" alt="Logo Institut Escola Miquel Martí i Pol">
            
            <div class="login-divider"></div>
            
            <h1>Benvingut al Portal IEMMP</h1>
            <p>Inicia sessió per continuar</p>

            <div class="input-group">
                <span class="input-icona">👤</span>
                <input type="text" id="usuari" placeholder="Usuari">
            </div>

            <div class="input-group">
                <span class="input-icona">🔒</span>
                <input type="password" id="contrasenya" placeholder="Contrasenya">
            </div>

            <button onclick="iniciarSessio()">Entrar</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
